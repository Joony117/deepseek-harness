# Keyless context-overflow replay composition.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.99
    retainTokens: 20
    maxTokens: 32

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 128000

- id: tool-result-pruner
  config:
    thresholdChars: 100
    headChars: 20
    tailChars: 20

# This read-only fixture has no platform-specific shell or skill catalog.
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: skill
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: system-prompt
  config:
    personaPrefix: You are a concise snapshot agent working in {{cwd}}.
